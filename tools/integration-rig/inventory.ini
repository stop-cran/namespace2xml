# Two nodes with deliberately different variables, because the point of the module is that a node's
# own inputs decide that node's own state. If both nodes rendered the same bytes the suite could not
# tell node-local rendering from a controller-side render that was copied out.
[nodes]
node1 ansible_host=n2x-node1 n2x_port=8080 n2x_tier=blue
node2 ansible_host=n2x-node2 n2x_port=9090 n2x_tier=green

[nodes:vars]
ansible_user=ansible
ansible_ssh_private_key_file=/root/.ssh/id_rig
ansible_python_interpreter=/usr/bin/python3
