name: release

# Tag-only. namespace2xml 2.x published to nuget.org on every push to master, which meant any
# commit reaching the default branch was published under the trusted package name without a
# separate reviewed act. Publication is now a deliberate, signed, tagged decision.
on:
  push:
    tags:
      - 'v3.*'

permissions:
  contents: write      # create the GitHub release
  id-token: write      # OIDC, for both the build attestation and the nuget.org token exchange
  attestations: write  # record the provenance attestation

env:
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'

jobs:
  release:
    runs-on: ubuntu-latest
    environment: nuget
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: The tag must name the version the build produces
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          declared=$(grep -oPm1 '(?<=<Version>)[^<]+' Directory.Build.props)
          if [ "$tag" != "$declared" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match <Version>$declared</Version>"
            exit 1
          fi
          echo "version=$declared" >> "$GITHUB_ENV"

      - run: dotnet restore namespace2xml.slnx

      - name: Assemble the release notes before anything irreversible happens
        shell: bash
        run: |
          set -euo pipefail
          # Passing the whole changelog buried each version under every earlier one, and would
          # have got worse with every release. Take the section between this version's heading
          # and the next top-level heading.
          #
          # This runs before the push on purpose. A missing section is worth stopping for, and
          # stopping is only cheap while nothing has been published: after the push it would
          # leave a package on nuget.org with no release to explain it.
          awk -v v="## [$version]" '
            index($0, v) == 1 { inside = 1; next }
            inside && /^## / { exit }
            inside { print }
          ' CHANGELOG.md > /tmp/notes.md
          if [ ! -s /tmp/notes.md ]; then
            echo "::error::CHANGELOG.md has no section for $version; refusing to publish a release with empty notes."
            exit 1
          fi
          {
            echo "Contract bundle: \`$(grep -oPm1 '(?<="revision": ")[^"]+' spec/contract-bundle.json)\`"
            echo
            echo "Specification: https://github.com/${GITHUB_REPOSITORY}/blob/${GITHUB_REF_NAME}/docs/specification.md"
            echo
            cat /tmp/notes.md
          } > /tmp/release-notes.md

      - run: dotnet build namespace2xml.slnx --no-restore -c Release
      - run: dotnet test namespace2xml.slnx --no-build -c Release

      - name: Pack
        run: dotnet pack src/Namespace2Xml.Cli/Namespace2Xml.Cli.csproj --no-build -c Release -o artifacts

      - name: The package must carry symbols and the specification
        shell: bash
        run: |
          set -euo pipefail
          # $version is an ordinary environment variable here, exported by GITHUB_ENV above.
          # Reading it as a shell variable, rather than letting an Actions expression be
          # substituted into the script text, keeps the workflow free of quoting hazards.
          test -f "artifacts/namespace2xml.${version}.nupkg"
          test -f "artifacts/namespace2xml.${version}.snupkg"
          unzip -l "artifacts/namespace2xml.${version}.nupkg" | grep -q 'docs/specification.md'
          unzip -l "artifacts/namespace2xml.${version}.nupkg" | grep -q 'diagnostics.registry.json'
          unzip -l "artifacts/namespace2xml.${version}.snupkg" | grep -q '\.pdb'

      - name: The symbols must reach their source, not merely exist
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        # The check above proves the symbol package contains a .pdb. A .pdb whose documents nobody
        # can resolve satisfies that and is worth nothing: symbols only pay for themselves if the
        # path from a stack trace back to source is real. This walks that path for every document,
        # and compares the bytes served against the checksum the compiler recorded rather than
        # settling for a 200 - between two adjacent previews 90 of 131 files were byte-identical,
        # so a status-only check would have accepted a package pinned to the wrong commit.
        # The tag is pushed by the time this runs, so its SourceLink URLs are already servable.
        run: pwsh -NoProfile -File tools/verify-sourcelink.ps1 -SymbolPackage "artifacts/namespace2xml.${env:version}.snupkg"

      - name: Install the packed tool and check it reports the released contract
        shell: bash
        run: |
          set -euo pipefail
          dotnet tool install --tool-path /tmp/n2x --add-source artifacts --version "$version" namespace2xml
          /tmp/n2x/namespace2xml --version | tee /tmp/version.txt
          # Anchored: IncludeSourceRevisionInInformationalVersion is disabled in
          # Directory.Build.props, so the reported version carries no +sha suffix and this
          # comparison is exact rather than incidentally passing on a prefix.
          grep -q "^version: ${version}$" /tmp/version.txt
          grep -q '^contract-bundle: ' /tmp/version.txt

      - name: The packed tool must satisfy the conformance corpus
        shell: pwsh
        run: pwsh -NoProfile -File tools/verify-packaged-corpus.ps1 -Package artifacts

      - name: Every link the tool prints must resolve, and to these bytes
        shell: bash
        run: |
          set -euo pipefail
          # --version and --help are the tool's discovery surface, and for an automated caller
          # they are the only one. A link that 404s turns "here is the contract" into a dead end
          # that nobody notices until someone follows it. The links are pinned to this tag, so
          # they can be checked now and can never drift afterwards.
          /tmp/n2x/namespace2xml --help > /tmp/help.txt
          urls=$(cat /tmp/version.txt /tmp/help.txt | grep -oE 'https://github\.com/[^ ]+' | sort -u)
          test -n "$urls"
          for url in $urls; do
            echo "checking $url"
            curl -fsSL -o /dev/null "$url"
          done
          # The reported hash must be the hash of the bytes the reported link serves, or a report
          # naming that revision cannot be resolved to anything.
          raw="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${GITHUB_REF_NAME}/docs/specification.md"
          declared=$(grep '^specification-sha256: ' /tmp/version.txt | cut -d' ' -f2)
          served=$(curl -fsSL "$raw" | sha256sum | cut -d' ' -f1)
          if [ "$declared" != "$served" ]; then
            echo "::error::--version reports $declared but $raw hashes to $served"
            exit 1
          fi

      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: 'artifacts/*.nupkg'

      # Requested immediately before the push on purpose: nuget.org's short-lived key is valid for
      # one hour and each OIDC token buys exactly one key, so anything slow placed between this
      # step and the push is a way to expire a credential mid-release.
      - name: Exchange this run's OIDC identity for a short-lived nuget.org key
        uses: NuGet/login@v1
        id: nuget-login
        with:
          # The nuget.org profile name, which is public -- it is printed on the package page. A
          # secret here would buy nothing and would reintroduce the failure this workflow already
          # had once: an undefined secret expands to the empty string rather than to an error.
          user: stop-cran

      - name: Push to nuget.org
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$NUGET_API_KEY" ]; then
            echo "::error::the OIDC exchange returned no key; nothing was published."
            exit 1
          fi
          dotnet nuget push "artifacts/*.nupkg" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate
          dotnet nuget push "artifacts/*.snupkg" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate

      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          prerelease=""
          case "$version" in *-*) prerelease="--prerelease";; esac
          gh release create "$GITHUB_REF_NAME" artifacts/*.nupkg artifacts/*.snupkg \
            --title "namespace2xml $version" \
            --notes-file /tmp/release-notes.md $prerelease
