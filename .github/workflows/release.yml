name: release

# Tag-only. namespace2xml 2.x published to nuget.org on every push to master, which meant any
# commit reaching the default branch was published under the trusted package name without a
# separate reviewed act. Publication is now a deliberate, signed, tagged decision.
on:
  push:
    tags:
      - 'v3.*'

permissions:
  contents: write
  id-token: write
  attestations: write

env:
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'

jobs:
  release:
    runs-on: ubuntu-latest
    environment: nuget
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: The tag must name the version the build produces
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          declared=$(grep -oPm1 '(?<=<Version>)[^<]+' Directory.Build.props)
          if [ "$tag" != "$declared" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match <Version>$declared</Version>"
            exit 1
          fi
          echo "version=$declared" >> "$GITHUB_ENV"

      - run: dotnet restore namespace2xml.slnx
      - run: dotnet build namespace2xml.slnx --no-restore -c Release
      - run: dotnet test namespace2xml.slnx --no-build -c Release

      - name: Pack
        run: dotnet pack src/Namespace2Xml.Cli/Namespace2Xml.Cli.csproj --no-build -c Release -o artifacts

      - name: The package must carry symbols and the specification
        shell: bash
        run: |
          set -euo pipefail
          test -f "artifacts/namespace2xml.${{ env.version }}.nupkg"
          test -f "artifacts/namespace2xml.${{ env.version }}.snupkg"
          unzip -l "artifacts/namespace2xml.${{ env.version }}.nupkg" | grep -q 'docs/specification.md'
          unzip -l "artifacts/namespace2xml.${{ env.version }}.nupkg" | grep -q 'diagnostics.registry.json'
          unzip -l "artifacts/namespace2xml.${{ env.version }}.snupkg" | grep -q '\.pdb'

      - name: Install the packed tool and check it reports the released contract
        shell: bash
        run: |
          set -euo pipefail
          dotnet tool install --tool-path /tmp/n2x --add-source artifacts --version "${{ env.version }}" namespace2xml
          /tmp/n2x/namespace2xml --version | tee /tmp/version.txt
          grep -q "^version: ${{ env.version }}$" /tmp/version.txt
          grep -q '^contract-bundle: ' /tmp/version.txt

      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: 'artifacts/*.nupkg'

      - name: Push to nuget.org
        run: |
          dotnet nuget push "artifacts/*.nupkg" --api-key "${{ secrets.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate
          dotnet nuget push "artifacts/*.snupkg" --api-key "${{ secrets.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate

      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          case "${{ env.version }}" in *-*) prerelease="--prerelease";; esac
          gh release create "$GITHUB_REF_NAME" artifacts/*.nupkg artifacts/*.snupkg \
            --title "namespace2xml ${{ env.version }}" \
            --notes-file CHANGELOG.md $prerelease
