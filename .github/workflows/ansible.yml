name: ansible

# The Galaxy collection under ansible/ is a second shipped artifact with a second toolchain, and
# almost none of it can be exercised on a maintainer's Windows workstation: ansible-test refuses to
# run there at all, and `ansible.utils.display` -- which the filter imports to surface the tool's
# WARN diagnostics -- cannot even be imported without fcntl. That makes this workflow the only
# place several of the collection's gates exist, so it is written to fail loudly rather than to be
# convenient, and each job is separated so that a failure is named on the summary page instead of
# being buried in a combined log.

on:
  push:
    branches: [master, v3]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ansible-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 'true'
  # ansible-test insists on being run from inside an ansible_collections tree whose directory names
  # are the namespace and collection name. The repository cannot be laid out that way -- the
  # collection is one directory in a .NET repository -- so every job copies it into place first.
  COLLECTION_TREE: ansible_collections/stop_cran/namespace2xml

jobs:
  # ansible-test sanity is what Galaxy and the wider ecosystem judge a collection by, and its most
  # valuable test here is the documentation one: it parses the plugin's DOCUMENTATION, EXAMPLES and
  # RETURN blocks and fails if an option is undocumented, misspelled, or has a type the code does
  # not agree with. Those blocks are the collection's entire discoverability story -- `ansible-doc
  # -t filter stop_cran.namespace2xml.render` is how an operator, and an agent, finds out what the
  # filter takes -- so an unparsed docstring is a shipped defect, not a lint nit.
  sanity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install ansible-core
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet --disable-pip-version-check 'ansible-core>=2.21,<2.22'
          ansible --version

      # A gate that measures nothing passes. The collection is copied rather than symlinked because
      # ansible-test resolves the collection's identity from the real path of its parent
      # directories, and the file count is asserted so that a copy which silently moved no plugin
      # cannot be reported as a clean sanity run.
      - name: Stage the collection
        shell: bash
        run: |
          set -euo pipefail
          dest="$RUNNER_TEMP/$COLLECTION_TREE"
          mkdir -p "$(dirname "$dest")"
          cp -a ansible "$dest"
          plugins=$(find "$dest/plugins" -name '*.py' | wc -l)
          if [ "$plugins" -lt 1 ]; then
            echo "Staged collection has no plugins; the sanity run would prove nothing." >&2
            exit 1
          fi
          test -f "$dest/galaxy.yml"
          test -f "$dest/meta/runtime.yml"

      # --venv rather than --docker: the sanity tests each want a different, pinned set of
      # requirements, and letting ansible-test build those venvs is both lighter than pulling its
      # container image and closer to how a contributor would run this locally.
      - name: ansible-test sanity
        shell: bash
        working-directory: ${{ runner.temp }}/ansible_collections/stop_cran/namespace2xml
        run: |
          set -euo pipefail
          ansible-test sanity --venv --python 3.13 --color -v

  # ansible-test sanity validates the plugins' own DOCUMENTATION blocks and nothing else. The
  # prose pages under docs/docsite are rendered by antsibull-docs, which Galaxy runs and this
  # repository does not, so an unknown role or a toctree entry naming a file that is not there
  # would be discovered on the docs site after publishing -- and a published version cannot be
  # replaced. This job is the only thing that reads extra-docs.yml before a consumer does.
  docsite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install antsibull-docs
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet --disable-pip-version-check \
            'ansible-core>=2.21,<2.22' antsibull-docs
          antsibull-docs --version

      - name: Stage the collection
        shell: bash
        run: |
          set -euo pipefail
          dest="$RUNNER_TEMP/$COLLECTION_TREE"
          mkdir -p "$(dirname "$dest")"
          cp -a ansible "$dest"
          test -f "$dest/docs/docsite/extra-docs.yml"

      # The linter reports problems on stdout and still exits zero in some versions, so the
      # output is checked as well as the status. A silent pass that printed complaints is the
      # exact failure mode this job exists to prevent.
      - name: antsibull-docs lint-collection-docs
        shell: bash
        env:
          ANSIBLE_COLLECTIONS_PATH: ${{ runner.temp }}
        run: |
          set -euo pipefail
          dest="$RUNNER_TEMP/$COLLECTION_TREE"
          status=0
          antsibull-docs lint-collection-docs --plugin-docs "$dest" > "$RUNNER_TEMP/lint.txt" 2>&1 \
            || status=$?
          cat "$RUNNER_TEMP/lint.txt"
          if [ "$status" -ne 0 ] || [ -s "$RUNNER_TEMP/lint.txt" ]; then
            echo "::error::antsibull-docs reported problems in the collection documentation"
            exit 1
          fi
          echo "the collection documentation lints clean"

  # `ansible-galaxy collection build` reports success for any tree it can read, including one whose
  # build_ignore has quietly swallowed a plugin, and the tarball -- not the repository -- is the
  # whole of what a Galaxy consumer ever receives. Ten files reach them; everything else in this
  # repository, including the specification, CONTRIBUTING and the issue forms, does not. So the
  # artifact's contents are asserted here against what git tracks, and the assertion names the
  # missing file rather than failing on a count.
  #
  # This is also the gate the release workflow depends on: publishing to Galaxy cannot be undone,
  # and a version number cannot be reused, so a defect found after the push costs a version.
  artifact:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install ansible-core
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet --disable-pip-version-check 'ansible-core>=2.21,<2.22'

      - name: Build the collection
        shell: bash
        run: |
          set -euo pipefail
          ansible-galaxy collection build ansible --output-path "$RUNNER_TEMP/build" -vv

      - name: Every tracked file reaches the tarball
        shell: bash
        run: |
          set -euo pipefail
          tarball=$(find "$RUNNER_TEMP/build" -name '*.tar.gz')
          if [ "$(printf '%s\n' "$tarball" | wc -l)" -ne 1 ]; then
            echo "::error::expected exactly one built tarball, found: $tarball"
            exit 1
          fi
          echo "Built $(basename "$tarball")"

          tar -tzf "$tarball" | sed 's#^\./##' | sort -u > "$RUNNER_TEMP/shipped.txt"
          # galaxy.yml is consumed rather than shipped: the build turns it into MANIFEST.json.
          git ls-files -- ansible \
            | sed 's#^ansible/##' \
            | grep -vx 'galaxy.yml' \
            | sort -u > "$RUNNER_TEMP/tracked.txt"

          missing=$(comm -23 "$RUNNER_TEMP/tracked.txt" "$RUNNER_TEMP/shipped.txt")
          if [ -n "$missing" ]; then
            echo "::error::these files are tracked under ansible/ but absent from the built collection:"
            printf '%s\n' "$missing"
            echo "Check build_ignore in ansible/galaxy.yml."
            exit 1
          fi

          # The two generated files are what makes the tarball a collection rather than an archive.
          for generated in MANIFEST.json FILES.json; do
            if ! grep -qxF "$generated" "$RUNNER_TEMP/shipped.txt"; then
              echo "::error::the built collection has no $generated"
              exit 1
            fi
          done
          echo "all $(wc -l < "$RUNNER_TEMP/tracked.txt") tracked files are present, plus MANIFEST.json and FILES.json"

      - name: The tarball installs and both plugins resolve
        shell: bash
        run: |
          set -euo pipefail
          # Installing from the artifact rather than from the source tree is the point: this is the
          # only step that exercises what a consumer actually runs, including whether meta/runtime.yml
          # survives the round trip well enough for the collection loader to accept it.
          tarball=$(find "$RUNNER_TEMP/build" -name '*.tar.gz')
          ansible-galaxy collection install "$tarball" -p "$RUNNER_TEMP/installed" --force
          ANSIBLE_COLLECTIONS_PATH="$RUNNER_TEMP/installed" \
            ansible-doc -t filter stop_cran.namespace2xml.render >/dev/null
          # The module ships module_utils that the filter does not, and a module_utils file left
          # out of build_ignore's blast radius would import fine from the source tree and fail only
          # here. That is the failure this line exists to catch.
          ANSIBLE_COLLECTIONS_PATH="$RUNNER_TEMP/installed" \
            ansible-doc -t module stop_cran.namespace2xml.render >/dev/null
          echo "the installed collection resolves both stop_cran.namespace2xml.render plugins"

  # The unit tests are the specification-side half of a two-sided oracle: they hold hand-authored
  # profile text from docs/specification.md against what the encoder produces, with the binary
  # stubbed out entirely. Their expectations must never be regenerated from the code they test.
  units:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install ansible-core
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet --disable-pip-version-check 'ansible-core>=2.21,<2.22'

      # ansible-test units reports success when it collects nothing at all, so the five modules are
      # named here. Adding a sixth is meant to fail this line: an unlisted test file is a test file
      # nobody notices has stopped running.
      - name: Stage the collection
        shell: bash
        run: |
          set -euo pipefail
          dest="$RUNNER_TEMP/$COLLECTION_TREE"
          mkdir -p "$(dirname "$dest")"
          cp -a ansible "$dest"
          mapfile -t modules < <(find "$dest/tests/unit" -name 'test_*.py' | sort)
          if [ "${#modules[@]}" -ne 6 ]; then
            printf 'Expected 6 unit test modules, found %d:\n' "${#modules[@]}" >&2
            printf '  %s\n' "${modules[@]}" >&2
            exit 1
          fi

      - name: ansible-test units
        shell: bash
        working-directory: ${{ runner.temp }}/ansible_collections/stop_cran/namespace2xml
        run: |
          set -euo pipefail
          ansible-test units --venv --python 3.13 --color -v

  # meta/runtime.yml claims requires_ansible '>=2.14'. A claim in a metadata file that no gate reads
  # is a guess, and 2.14 is not an arbitrary floor: it is the first release whose ansible-doc can
  # read a filter plugin's inline DOCUMENTATION at all, which is the whole reason the collection
  # documents itself the way it does. This job holds the claim to its two load-bearing parts -- the
  # docs render, and the plugin behaves -- on the floor and on three releases above it.
  #
  # It runs plain pytest rather than `ansible-test units` on purpose. ansible-test's own machinery
  # changed substantially across this range, and a failure there would say something about
  # ansible-test rather than about the filter.
  compatibility:
    strategy:
      fail-fast: false
      matrix:
        include:
          - ansible: '2.14'
            python: '3.11'
          - ansible: '2.16'
            python: '3.12'
          - ansible: '2.19'
            python: '3.13'
          - ansible: '2.21'
            python: '3.13'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install ansible-core ${{ matrix.ansible }}
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet --disable-pip-version-check \
            "ansible-core~=${{ matrix.ansible }}.0" pytest
          # pip is free to resolve something other than what the matrix asked for -- a yanked
          # release, a conflicting pin -- and a compatibility matrix that quietly tested one version
          # four times would look identical to a green one.
          installed=$(python -c 'import ansible.release as r; print(r.__version__)')
          echo "Resolved ansible-core $installed"
          case "$installed" in
            ${{ matrix.ansible }}.*) ;;
            *) echo "Expected ansible-core ${{ matrix.ansible }}.x, got $installed" >&2; exit 1 ;;
          esac

      - name: Stage the collection
        shell: bash
        run: |
          set -euo pipefail
          dest="$RUNNER_TEMP/$COLLECTION_TREE"
          mkdir -p "$(dirname "$dest")"
          cp -a ansible "$dest"

      # The precise claim behind the version floor: this release can find each plugin by its fully
      # qualified name and render its documentation. Grepping for an option name rather than merely
      # checking the exit code, because ansible-doc has historically been willing to print an empty
      # skeleton for a plugin whose docstring it could not parse.
      - name: ansible-doc reads both plugins' documentation
        shell: bash
        env:
          ANSIBLE_COLLECTIONS_PATH: ${{ runner.temp }}
        run: |
          set -euo pipefail
          doc=$(ansible-doc -t filter stop_cran.namespace2xml.render)
          printf '%s\n' "$doc"
          for expected in memoize selector delimiter workdir; do
            if ! printf '%s' "$doc" | grep -q "$expected"; then
              echo "ansible-doc output does not mention the filter's '$expected' option." >&2
              exit 1
            fi
          done

          doc=$(ansible-doc -t module stop_cran.namespace2xml.render)
          printf '%s\n' "$doc"
          for expected in scheme_text variables dest src; do
            if ! printf '%s' "$doc" | grep -q "$expected"; then
              echo "ansible-doc output does not mention the module's '$expected' option." >&2
              exit 1
            fi
          done

      - name: The filter loads and runs under this ansible-core
        shell: bash
        env:
          ANSIBLE_COLLECTIONS_PATH: ${{ runner.temp }}
        run: |
          set -euo pipefail
          # The step above proves ansible-doc can parse the docstring, which it does by reading
          # the source rather than importing it. This one proves the release can actually load
          # and call the plugin, which is a different claim and the one the version floor is
          # really making: the filter reaches its own module_utils by relative import, and that
          # only resolves if this ansible-core gives a collection plugin real package semantics.
          #
          # No binary is needed. Section 16.1's format check runs before the tool is resolved,
          # so a deliberately bad format reaches the filter, executes it, and comes back with a
          # message only the filter could have produced. A broken import fails here instead,
          # and fails with an import error rather than this text.
          cat > /tmp/probe.yml <<'PLAY'
          - hosts: localhost
            connection: local
            gather_facts: false
            tasks:
              - name: A bad format must be refused by the filter, not by the tool
                debug:
                  msg: "{{ {'a': 1} | stop_cran.namespace2xml.render('not-a-format') }}"
                register: outcome
                ignore_errors: true

              - name: The refusal has to be the filter's own
                assert:
                  that:
                    - outcome is failed
                    - "'not-a-format' in (outcome.msg | default(''))"
                    - "'quotednamespace' in (outcome.msg | default(''))"
                  fail_msg: "The filter did not run: {{ outcome.msg | default('no message') }}"
          PLAY
          ansible-playbook -i localhost, /tmp/probe.yml

      - name: The unit tests pass against this ansible-core
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest ansible/tests/unit -q

  # Everything above stubs the transformer out. This job is the only place the real binary, the real
  # filter and a real controller meet, and it asserts documents rather than mechanics: the
  # expectations in the integration target are authored from docs/specification.md, so a tool change
  # that alters output has to argue with the specification here rather than be absorbed.
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install ansible-core
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet --disable-pip-version-check 'ansible-core>=2.21,<2.22'

      # The tool comes from this repository, packed and installed the way a user installs it, rather
      # than from the published package on the public feed. A collection tested against the last
      # release would go green on a commit that broke the very output it renders.
      - name: Pack and install the transformer as a global tool
        shell: bash
        run: |
          set -euo pipefail
          version=$(python -c "import xml.etree.ElementTree as ET; print(ET.parse('Directory.Build.props').findtext('.//Version').strip())")
          echo "Declared version: $version"
          pack="$RUNNER_TEMP/pack"
          dotnet pack src/Namespace2Xml.Cli/Namespace2Xml.Cli.csproj -c Release -o "$pack"
          # --source, not --add-source. --add-source *adds* a feed alongside the configured
          # ones, leaving the public feed in the running; this exact version is published there,
          # so resolution could satisfy itself from the last release while the job reported that
          # it had installed the checkout. The subsequent --version check cannot tell them apart,
          # because they deliberately share a version and a contract revision. --source replaces
          # the source list outright, so the only place the package can come from is the pack.
          dotnet tool install --global --source "$pack" --version "$version" namespace2xml
          "$HOME/.dotnet/tools/namespace2xml" --version

      - name: Stage the collection
        shell: bash
        run: |
          set -euo pipefail
          dest="$RUNNER_TEMP/$COLLECTION_TREE"
          mkdir -p "$(dirname "$dest")"
          cp -a ansible "$dest"
          test -f "$dest/tests/integration/targets/render/tasks/main.yml"
          test -f "$dest/tests/integration/targets/render_module/tasks/main.yml"

      # Arm one: the ordinary case, with the tool on PATH.
      - name: Integration suite, tool on PATH
        shell: bash
        working-directory: ${{ runner.temp }}/ansible_collections/stop_cran/namespace2xml
        run: |
          set -euo pipefail
          export PATH="$HOME/.dotnet/tools:$PATH"
          command -v namespace2xml
          ansible-test integration --local --python 3.13 --color -v render render_module

      # Arm two, and the reason both plugins have a dotnet global-tools fallback at all. `dotnet tool
      # install --global` writes to ~/.dotnet/tools whether or not the login shell puts that on
      # PATH, and a filter runs inside ansible-playbook, whose environment was fixed before the play
      # began -- so a play that installs the tool in one task and templates with it in a later one
      # sees exactly this environment. The module has the same problem for a different reason: the
      # play that installs the tool on a node and the task that runs it are two SSH sessions, and
      # the second one's PATH is whatever the node's login shell says it is. Only the tools
      # directory is removed, so a failure here is about the fallback rather than about a
      # stripped-down PATH breaking ansible-test itself.
      - name: Integration suite, tool deliberately off PATH
        shell: bash
        working-directory: ${{ runner.temp }}/ansible_collections/stop_cran/namespace2xml
        run: |
          set -euo pipefail
          PATH=$(python -c "import os; print(os.pathsep.join(p for p in os.environ['PATH'].split(os.pathsep) if '.dotnet/tools' not in p))")
          export PATH
          if command -v namespace2xml; then
            echo "namespace2xml is still on PATH; this arm would prove nothing." >&2
            exit 1
          fi
          ansible-test integration --local --python 3.13 --color -v render render_module
