### The Ansible collection's version is independent of the tool's.
#
# namespace2xml the .NET tool is at 3.x, and so is this collection -- but that is a coincidence
# of timing, not a rule. This collection is a separate artefact with its own compatibility
# promise: it pins no tool version, so the two version streams answer different questions and are
# released under different tags -- `v3.*` for the tool, `ansible-v*` for this collection.
#
# 2.0.0 rather than 1.1.0 because the 1.0.0 documentation stated, as a requirement, that target
# nodes need neither .NET nor the tool. Adding the `render` module makes that false for any play
# that uses it, and a promise about what a consumer must install is exactly the kind a major
# version exists to revise. Nothing in the filter's interface changed.
#
# 2.1.0 adds two things at once, released together and therefore carrying one version. First,
# `scheme_yaml` on both plugins: the same scheme written as a mapping rather than as a block of
# text inside a YAML file. Second, the filter's `convention` argument, which selects whether a
# mapping key's `@`, `Q{}` and `#` markers are escaped into an ordinary name (the default, and
# what every earlier release did) or read as the Section 11.4 XML addressing. Both are additive,
# so a minor -- every 2.0.0 playbook renders identically byte for byte, and the two scheme
# spellings are compared byte for byte by the integration suite.
#
# 2.2.0 changes no plugin behaviour: it ships the diagnostic registry inside the collection and
# corrects documentation that had drifted from the code. It is a minor rather than a patch for
# one reason -- it raises the ansible-core floor from 2.14 to 2.15. Narrowing the range of
# Ansible a consumer may run this on is a revision of the compatibility promise, and this file
# already argues that a promise about what a consumer must install is not a patch-level change.
#
# 2.3.0 gives the filter `scheme_text` as a second name for its `scheme`. On the module `scheme`
# is file paths and `scheme_text` is inline text; on the filter `scheme` *is* the inline text, so
# moving a render between the two plugins meant renaming an argument for no reason a play author
# could see. Additive, so a minor: `scheme` keeps its meaning and is not deprecated. The same
# change makes every scheme refusal quote back the spelling the caller actually wrote, which was
# previously always `scheme` even for a play that had written `scheme_yaml`.
#
# 3.0.0 gives every source the same shape, and adds the `distribute` role. `inputs` and `scheme`
# are now ordered lists of entries in both plugins; an entry is a bare string naming a file, or a
# mapping carrying `file`, `text` or `data`. The same list means the same thing on either plugin,
# and sources compose -- a small override layers onto a shared file, which the filter could not
# express at all before because it had no `inputs`. Three things break rather than change, which
# is why this is a major: a filter `scheme` given as a plain string is now a *filename* where it
# used to be scheme text (refused rather than misread, since scheme text is rarely a path that
# exists); `format` is refused beside `file` and beside `data`, where it was previously accepted
# and ignored; and `src`, `scheme_text` and `scheme_yaml` are deprecated -- still working, still
# composing as before, and warning. The `distribute` role covers the topology neither plugin did:
# render on the controller and converge on the node, with nothing installed on the node, for
# fleets that cannot host a .NET runtime or should not each render their own copy.
#
# 3.0.1 fixes three defects in the `distribute` role, all found by exploratory testing against
# real nodes rather than by the suite. The one that decides the severity: a node that stopped
# answering part way through took the whole host out of the play before the cleanup ran, leaving
# the controller's staging directory behind with the rendered configuration still in it -- which
# for any play that renders credentials means plaintext secrets left on disk after a run that
# looked like an ordinary unreachable-host failure. The role now keeps the host alive long enough
# to remove the staging directory and only then fails it. That has one visible consequence a play
# author has to know about: such a host is now reported as **failed** rather than **unreachable**,
# because there is no way to run cleanup first and still re-raise the original classification.
# Plays reading the recap -- `max_fail_percentage`, `any_errors_fatal`, `serial` -- should count
# failures here, not unreachables. The other two: directories below the destination are now all
# named explicitly, so `namespace2xml_distribute_directory_mode` reaches every one of them and
# keeps reaching them on later runs instead of applying only to the deepest; and no path component
# under the destination is followed if it is a symlink, so a link planted on a node cannot redirect
# rendered configuration outside the directory the play named. A destination that is itself a link
# stays a supported choice. A patch rather than a minor: no argument was added, removed or
# renamed, no floor was raised, and every play that was not hitting one of these three defects
# renders and copies exactly what it did before.
namespace: stop_cran
name: namespace2xml
version: 3.0.1
readme: README.md

authors:
  - stop-cran <stop-cran@list.ru>

description: >-
  Render configuration as XML, JSON, YAML, INI or namespace text through the namespace2xml
  transformer: a controller-side filter for data held in play variables, and a module that
  renders a managed node's own files in place.

license:
  - Apache-2.0

tags:
  - configuration
  - xml
  - json
  - yaml
  - ini
  - templating
  - tools

# No collection depends on this one and this one depends on no collection. The transformer it
# drives is a .NET tool, which Galaxy has no way to express as a dependency -- both plugins
# resolve it at call time and say what to install if it is missing.
dependencies: {}

repository: https://github.com/stop-cran/namespace2xml
documentation: https://github.com/stop-cran/namespace2xml/blob/master/ansible/README.md
homepage: https://github.com/stop-cran/namespace2xml
issues: https://github.com/stop-cran/namespace2xml/issues

build_ignore:
  # ansible-test writes here. It is generated, sometimes large, and never useful to a consumer.
  - tests/output
  - '*.pyc'
  - __pycache__
  - .pytest_cache
