---
# Integration coverage for the stop_cran.namespace2xml.render *module*.
#
# The unit tests under tests/unit/plugins/module_utils prove the logic around the tool: argument
# order, the refusal to overwrite an input, byte comparison, check mode and diff. They stub the
# binary out, so they can run anywhere, but they can only prove that the module does the right
# thing with whatever the tool returns.
#
# This target proves the rest, and it is the half that matters most for a module: that a real
# render against a real binary *converges*. A transformer that is deterministic in principle but
# whose output the module compares wrongly would show up here as a second run reporting changed,
# and nowhere else.
#
# Expectations are authored from docs/specification.md -- Section 24 for determinism, Section 11.7
# for NormalizeFormattingWhitespace, Section 16.8 for unqualified input options, Section 16.10 for
# the append high-water rule -- and not captured from a tool run.
#
# The first case is the collection README's module example, verbatim, so the example on the front
# page cannot silently stop being true.

- name: Create a scratch directory
  ansible.builtin.tempfile:
    state: directory
    suffix: n2xmod
  register: scratch

- name: Fail the target loudly rather than skipping if the scratch directory is missing
  ansible.builtin.assert:
    that:
      - scratch.path is defined

- block:
    - name: Create the directory the template lives in
      ansible.builtin.file:
        path: "{{ scratch.path }}/template"
        state: directory
        mode: "0755"

    - name: Stage a pristine template the render never writes to
      ansible.builtin.copy:
        dest: "{{ scratch.path }}/template/logback.xml"
        mode: "0644"
        content: |
          <configuration>
            <appender name="STDOUT" class="ch.qos.logback.core.ConsoleAppender">
              <encoder>
                <pattern>%-5level %logger - %msg%n</pattern>
              </encoder>
            </appender>
            <root level="INFO">
              <appender-ref ref="STDOUT" />
            </root>
          </configuration>

    # xmlinputoptions is unqualified on purpose. Section 16.8 makes a selector-qualified input
    # option a blocking SCHEME001, because input parsing precedes every output instance -- so
    # writing `configuration.xmlinputoptions=...` here would fail the target rather than change
    # the document, which is the behaviour worth pinning.
    - name: Render the README's module example
      stop_cran.namespace2xml.render:
        src:
          - "{{ scratch.path }}/template/logback.xml"
        scheme_text: |
          xmlinputoptions=NormalizeFormattingWhitespace
          configuration.output=xml
          configuration.filename=logback.xml
          configuration.root=configuration
        variables:
          configuration.root.@level: DEBUG
        dest: "{{ scratch.path }}/conf"
        mode: "0644"
      register: first

    - name: Read back what the node now has
      ansible.builtin.slurp:
        src: "{{ scratch.path }}/conf/logback.xml"
      register: rendered

    # The overlay changes one attribute. Everything else -- the appender, its class, the encoder,
    # the pattern's '%' and '-' -- has to survive unchanged, because a round trip that quietly
    # rewrote the parts nobody asked about would be far worse than one that failed.
    - name: The single addressed attribute changed and nothing else did
      ansible.builtin.assert:
        that:
          - first is changed
          - rendered.content | b64decode == expected_xml
        fail_msg: |
          Rendered XML did not match the specification-authored expectation.
          --- expected ---
          {{ expected_xml }}
          --- actual ---
          {{ rendered.content | b64decode }}
        success_msg: The node-side render produced the document the README shows.
      vars:
        expected_xml: |
          <?xml version="1.0" encoding="utf-8"?>
          <configuration>
            <appender name="STDOUT" class="ch.qos.logback.core.ConsoleAppender">
              <encoder>
                <pattern>%-5level %logger - %msg%n</pattern>
              </encoder>
            </appender>
            <root level="DEBUG">
              <appender-ref ref="STDOUT" />
            </root>
          </configuration>

    # Section 11.7 says enabling NormalizeFormattingWhitespace weakens the same-format round-trip
    # guarantee, and the tool records that as WARN007. The module forwards diagnostics rather than
    # swallowing them, and an operator who is told nothing about a weakened guarantee has no way
    # to discover it.
    - name: The weakened round-trip guarantee was reported, not suppressed
      ansible.builtin.assert:
        that:
          - "'WARN007' in first.diagnostics"
        fail_msg: "Expected WARN007 in diagnostics. Got: {{ first.diagnostics }}"

    - name: The identity of the binary that ran is reported
      ansible.builtin.assert:
        that:
          - first.tool_identity is search('\\|')
        fail_msg: >-
          tool_identity must carry both the version and the contract-bundle revision, separated
          by '|'. Got: {{ first.tool_identity }}

    # The whole point of a module rather than a shell task. Section 24 makes the tool's output
    # byte-identical for identical inputs, and the module turns that into idempotence by
    # comparing. A second run must be a no-op.
    - name: Render again from the same pristine template
      stop_cran.namespace2xml.render:
        src:
          - "{{ scratch.path }}/template/logback.xml"
        scheme_text: |
          xmlinputoptions=NormalizeFormattingWhitespace
          configuration.output=xml
          configuration.filename=logback.xml
          configuration.root=configuration
        variables:
          configuration.root.@level: DEBUG
        dest: "{{ scratch.path }}/conf"
        mode: "0644"
      register: second

    - name: The second run is a no-op
      ansible.builtin.assert:
        that:
          - second is not changed
          - second.changed_files == []
          - second.files == first.files
        fail_msg: >-
          Re-rendering identical inputs reported a change, so either the tool is not
          deterministic or the module is not comparing content.

    - name: Change the overlay under check mode
      stop_cran.namespace2xml.render:
        src:
          - "{{ scratch.path }}/template/logback.xml"
        scheme_text: |
          xmlinputoptions=NormalizeFormattingWhitespace
          configuration.output=xml
          configuration.filename=logback.xml
          configuration.root=configuration
        variables:
          configuration.root.@level: TRACE
        dest: "{{ scratch.path }}/conf"
      register: preview
      check_mode: true

    - name: Read the file check mode was not allowed to touch
      ansible.builtin.slurp:
        src: "{{ scratch.path }}/conf/logback.xml"
      register: after_preview

    - name: Check mode reported the change without making it
      ansible.builtin.assert:
        that:
          - preview is changed
          - "'DEBUG' in (after_preview.content | b64decode)"
          - "'TRACE' not in (after_preview.content | b64decode)"
        fail_msg: Check mode wrote to the node.

    # Section 16.10 defines merge=append as rebasing a later sequence contribution above the
    # current high-water mark, so a render that reads back its own output grows a sequence by one
    # copy per run -- silently, and for as long as the play keeps running. The module refuses the
    # arrangement outright, and the refusal has to name the reason: an operator told only "no"
    # will work around it.
    - name: Attempt a render whose output would land on its own input
      stop_cran.namespace2xml.render:
        src:
          - "{{ scratch.path }}/conf/logback.xml"
        scheme_text: |
          xmlinputoptions=NormalizeFormattingWhitespace
          configuration.output=xml
          configuration.filename=logback.xml
          configuration.root=configuration
        dest: "{{ scratch.path }}/conf"
      register: overwrite
      ignore_errors: true

    - name: Read the input the refusal protected
      ansible.builtin.slurp:
        src: "{{ scratch.path }}/conf/logback.xml"
      register: after_refusal

    - name: Writing over an input is refused, and the input is intact
      ansible.builtin.assert:
        that:
          - overwrite is failed
          - "'16.10' in overwrite.msg"
          - (after_refusal.content | b64decode) == (rendered.content | b64decode)
        fail_msg: >-
          Expected a refusal citing section 16.10.
          Result: {{ overwrite.msg | default('the render succeeded') }}

    # A structured value cannot become a namespace path without synthesizing names, which is the
    # filter's job and carries the filter's escaping. Accepting one here would make '@' unreachable
    # in exactly the option that exists to reach it.
    - name: Attempt a structured variable value
      stop_cran.namespace2xml.render:
        src:
          - "{{ scratch.path }}/template/logback.xml"
        scheme_text: |
          xmlinputoptions=NormalizeFormattingWhitespace
          configuration.output=xml
          configuration.filename=logback.xml
          configuration.root=configuration
        variables:
          configuration.root:
            level: DEBUG
        dest: "{{ scratch.path }}/conf"
      register: structured
      ignore_errors: true

    - name: A mapping value is refused and the message points at the filter
      ansible.builtin.assert:
        that:
          - structured is failed
          - "'filter' in structured.msg"
        fail_msg: >-
          Expected a refusal naming the filter as the way to render nested data.
          Result: {{ structured.msg | default('the render succeeded') }}

    # Section 8.3 gives a value a lexer. A value carrying a backslash is data, and if the module
    # hands it over unescaped the tool reads '\t' as a tab -- so an operator writing a Windows
    # path gets a configuration file containing control characters and no error at all. This is
    # asserted against the real binary because that is the only thing that proves the encoding is
    # the true inverse of the tool's decoder rather than merely self-consistent.
    #
    # The value is carried in a variable rather than written inline in the assertion. A Jinja
    # string literal processes backslash escapes exactly as Python's does, so an inline
    # 'C:\temp\new' in the `that:` expression would compare against a tab and a newline and pass
    # for the wrong reason. An unadorned YAML scalar is never templated, so this one is literal.
    - name: Name the awkward value once, literally
      ansible.builtin.set_fact:
        awkward: 'C:\temp\new ${JAVA_HOME} *'

    - name: Render a value that is entirely made of section 8.3 syntax
      stop_cran.namespace2xml.render:
        src:
          - "{{ scratch.path }}/template/logback.xml"
        scheme_text: |
          xmlinputoptions=NormalizeFormattingWhitespace
          configuration.output=xml
          configuration.filename=logback.xml
          configuration.root=configuration
        variables:
          configuration.root.@level: "{{ awkward }}"
        dest: "{{ scratch.path }}/escaped"
      register: escaping

    - name: Read what the escaped value became
      ansible.builtin.slurp:
        src: "{{ scratch.path }}/escaped/logback.xml"
      register: escaped_file

    - name: The value survived the round trip exactly as it was written
      ansible.builtin.assert:
        that:
          - escaping is changed
          - awkward in (escaped_file.content | b64decode)
        fail_msg: >-
          The value was not delivered verbatim. Unescaped, '\t' becomes a tab and '${JAVA_HOME}'
          becomes a section 8.4 reference that fails the render.
          Got: {{ escaped_file.content | b64decode }}

    # Section 21.1 requires publication through no-follow, handle-relative operations with
    # symbolic-link containment. The attack is concrete: anyone who can write inside 'dest'
    # replaces an output file with a link to a file they cannot write, and the next run under
    # become writes through it for them. Only a real filesystem can prove this one.
    - name: Create the directory the link will be planted in
      ansible.builtin.file:
        path: "{{ scratch.path }}/linked"
        state: directory
        mode: "0755"

    - name: Write the file the link will point at
      ansible.builtin.copy:
        content: "do not overwrite me\n"
        dest: "{{ scratch.path }}/offlimits"
        mode: "0644"

    - name: Plant a symbolic link where the next render will publish
      ansible.builtin.file:
        src: "{{ scratch.path }}/offlimits"
        dest: "{{ scratch.path }}/linked/logback.xml"
        state: link

    - name: Render into the directory holding the planted link
      stop_cran.namespace2xml.render:
        src:
          - "{{ scratch.path }}/template/logback.xml"
        scheme_text: |
          xmlinputoptions=NormalizeFormattingWhitespace
          configuration.output=xml
          configuration.filename=logback.xml
          configuration.root=configuration
        dest: "{{ scratch.path }}/linked"
      register: through_link

    - name: Read the file the link pointed at
      ansible.builtin.slurp:
        src: "{{ scratch.path }}/offlimits"
      register: offlimits

    - name: Read what was published in the link's place
      ansible.builtin.slurp:
        src: "{{ scratch.path }}/linked/logback.xml"
      register: published

    - name: The link was replaced rather than followed
      ansible.builtin.assert:
        that:
          - through_link is changed
          - (offlimits.content | b64decode) == "do not overwrite me\n"
          - "'<configuration' in (published.content | b64decode)"
        fail_msg: >-
          The render wrote through a symbolic link, which is the arbitrary-write primitive
          section 21.1 exists to close.
          The target now holds: {{ offlimits.content | b64decode }}

    # Section 16's output directives name paths, not just filenames, so the first render into a
    # tree that does not exist yet is the ordinary case rather than an edge one.
    - name: Render into a destination whose subdirectories do not exist
      stop_cran.namespace2xml.render:
        src:
          - "{{ scratch.path }}/template/logback.xml"
        scheme_text: |
          xmlinputoptions=NormalizeFormattingWhitespace
          configuration.output=xml
          configuration.filename=nested/deeper/logback.xml
          configuration.root=configuration
        dest: "{{ scratch.path }}/tree"
        mode: "0640"
      register: nested

    - name: Inspect the nested file
      ansible.builtin.stat:
        path: "{{ scratch.path }}/tree/nested/deeper/logback.xml"
      register: nested_stat

    - name: The tree was created and the requested mode applied
      ansible.builtin.assert:
        that:
          - nested is changed
          - nested_stat.stat.exists
          - nested_stat.stat.mode == '0640'
        fail_msg: >-
          A nested output path was not published correctly.
          Result: {{ nested_stat.stat | default('no such file') }}

    # check_mode: full is a claim about every difference the task can converge, not only about
    # content. A mode-only difference that reports 'ok' under --check and 'changed' on the real
    # run is exactly the surprise --check exists to prevent.
    - name: Preview a mode-only change
      stop_cran.namespace2xml.render:
        src:
          - "{{ scratch.path }}/template/logback.xml"
        scheme_text: |
          xmlinputoptions=NormalizeFormattingWhitespace
          configuration.output=xml
          configuration.filename=nested/deeper/logback.xml
          configuration.root=configuration
        dest: "{{ scratch.path }}/tree"
        mode: "0600"
      register: mode_preview
      check_mode: true

    - name: Inspect the file check mode was not allowed to touch
      ansible.builtin.stat:
        path: "{{ scratch.path }}/tree/nested/deeper/logback.xml"
      register: mode_stat

    - name: A mode-only difference is reported under check mode and not applied
      ansible.builtin.assert:
        that:
          - mode_preview is changed
          - mode_preview.changed_files == []
          - mode_stat.stat.mode == '0640'
        fail_msg: >-
          check_mode: full promises the dry run agrees with the real one. Content was converged,
          so changed_files must be empty, but the mode differed, so the task must still report
          changed. Got changed={{ mode_preview.changed }}, mode={{ mode_stat.stat.mode }}.

    # An existing non-directory output root is PATH001 under section 21.1, not something to
    # replace. The operator's file has to survive, and the message has to say why.
    - name: Attempt a render whose output root is an existing file
      stop_cran.namespace2xml.render:
        src:
          - "{{ scratch.path }}/template/logback.xml"
        scheme_text: |
          xmlinputoptions=NormalizeFormattingWhitespace
          configuration.output=xml
          configuration.filename=logback.xml
          configuration.root=configuration
        dest: "{{ scratch.path }}/offlimits"
      register: root_is_file
      ignore_errors: true

    - name: Read the file that was named as an output root
      ansible.builtin.slurp:
        src: "{{ scratch.path }}/offlimits"
      register: after_root

    - name: A file named as an output root is refused, not replaced
      ansible.builtin.assert:
        that:
          - root_is_file is failed
          - "'21.1' in root_is_file.msg"
          - (after_root.content | b64decode) == "do not overwrite me\n"
        fail_msg: >-
          Expected a refusal citing section 21.1.
          Result: {{ root_is_file.msg | default('the render succeeded') }}

    # Section 15 selects the scheme parser from the file extension, so a mapping written in the
    # playbook is a JSON scheme document rather than a second dialect. The claim worth proving on
    # a real binary is that the two spellings are the same scheme: a converter that quietly
    # mangled a name or dropped a directive would still render *something*, and only a byte
    # comparison against the text spelling catches it.
    - name: Render with the scheme written as a text block
      stop_cran.namespace2xml.render:
        src:
          - "{{ scratch.path }}/template/logback.xml"
        scheme_text: |
          xmlinputoptions=NormalizeFormattingWhitespace
          configuration.output=xml
          configuration.filename=logback.xml
          configuration.root=configuration
          configuration.appender.class.type=element
        dest: "{{ scratch.path }}/spelling/text"

    - name: Render the same scheme written as a YAML mapping
      stop_cran.namespace2xml.render:
        src:
          - "{{ scratch.path }}/template/logback.xml"
        scheme_yaml:
          xmlinputoptions: NormalizeFormattingWhitespace
          configuration:
            output: xml
            filename: logback.xml
            root: configuration
            appender:
              class:
                type: element
        dest: "{{ scratch.path }}/spelling/yaml"
      register: mapping_render

    - name: Read both renders
      ansible.builtin.slurp:
        src: "{{ scratch.path }}/spelling/{{ item }}/logback.xml"
      register: spellings
      loop:
        - text
        - yaml

    - name: The two spellings of one scheme produce the same bytes
      ansible.builtin.assert:
        that:
          - mapping_render is changed
          - spellings.results[0].content == spellings.results[1].content
          - "'<class>' in (spellings.results[1].content | b64decode)"
        fail_msg: >-
          scheme_yaml is a spelling of scheme_text, not a dialect. Either the renders differ, so
          the mapping was translated into a scheme that means something else, or the `type`
          directive did not travel and the comparison proved only that two no-op schemes agree.

    - name: Render again from the mapping spelling
      stop_cran.namespace2xml.render:
        src:
          - "{{ scratch.path }}/template/logback.xml"
        scheme_yaml:
          xmlinputoptions: NormalizeFormattingWhitespace
          configuration:
            output: xml
            filename: logback.xml
            root: configuration
            appender:
              class:
                type: element
        dest: "{{ scratch.path }}/spelling/yaml"
      register: mapping_again

    - name: The mapping spelling converges like any other scheme
      ansible.builtin.assert:
        that:
          - mapping_again is not changed
        fail_msg: >-
          Section 24 makes the render deterministic, so a second run over unchanged inputs must
          report ok. Got changed_files={{ mapping_again.changed_files | default('unknown') }}.

    # A multi-valued directive is one comma-separated scalar under section 15. YAML makes a
    # sequence the obvious guess, and the tool answers SCHEME001 about a file the author never
    # wrote. The module has to refuse it first, in the author's own vocabulary.
    - name: Attempt a mapping scheme with a sequence directive value
      stop_cran.namespace2xml.render:
        src:
          - "{{ scratch.path }}/template/logback.xml"
        scheme_yaml:
          configuration:
            output:
              - xml
              - json
        dest: "{{ scratch.path }}/sequence"
      register: sequence_value
      ignore_errors: true

    - name: A sequence directive value is refused by name, before the tool runs
      ansible.builtin.assert:
        that:
          - sequence_value is failed
          - "'xml,json' in sequence_value.msg"
        fail_msg: >-
          Expected a refusal naming the comma-separated spelling.
          Result: {{ sequence_value.msg | default('the render succeeded') }}

    - name: Attempt a mapping scheme alongside a text scheme
      stop_cran.namespace2xml.render:
        src:
          - "{{ scratch.path }}/template/logback.xml"
        scheme_text: |
          configuration.output=xml
        scheme_yaml:
          configuration:
            output: xml
        dest: "{{ scratch.path }}/both"
      register: both_spellings
      ignore_errors: true

    - name: Supplying both spellings of one scheme is refused
      ansible.builtin.assert:
        that:
          - both_spellings is failed
          - "'mutually exclusive' in both_spellings.msg"
        fail_msg: >-
          Expected the two spellings to be mutually exclusive.
          Result: {{ both_spellings.msg | default('the render succeeded') }}

    # Everything above this point speaks the 2.x spelling -- src, scheme_text, scheme_yaml -- which
    # is what makes it worth keeping: those plays must go on working. Nothing above exercises the
    # entry shape that 3.0 introduces, so the release's own surface would otherwise reach operators
    # having been proved only by unit tests that stub the binary out.
    - name: Create the directory those files live in
      ansible.builtin.file:
        path: "{{ scratch.path }}/entries"
        state: directory
        mode: "0755"

    - name: Stage two files an entry list can name
      ansible.builtin.copy:
        dest: "{{ scratch.path }}/entries/{{ item.name }}"
        mode: "0644"
        content: "{{ item.body }}"
      loop:
        - name: base.txt
          body: |
            cfg.a=from-bare-string
            cfg.shared=first
        - name: more.txt
          body: |
            cfg.b=from-file-mapping
            cfg.shared=second
      loop_control:
        label: "{{ item.name }}"

    # One list carrying every shape at once. Order is the point as much as shape: section 16.10
    # makes a later input win, so cfg.shared has to arrive as the last value written for it.
    - name: Render from a list mixing all four input spellings
      stop_cran.namespace2xml.render:
        inputs:
          - "{{ scratch.path }}/entries/base.txt"
          - file: "{{ scratch.path }}/entries/more.txt"
          - text: |
              cfg.c=from-text
              cfg.shared=third
          - data:
              d: from-data
        scheme:
          - data:
              cfg:
                output: xml
                root: cfg
        dest: "{{ scratch.path }}/entries-out"
      register: entry_shapes

    - name: Read the result
      ansible.builtin.slurp:
        src: "{{ entry_shapes.files[0] }}"
      register: entry_shapes_body

    - name: Every shape contributed, and the last writer of a shared name won
      ansible.builtin.assert:
        that:
          - (entry_shapes_body.content | b64decode) is search('from-bare-string')
          - (entry_shapes_body.content | b64decode) is search('from-file-mapping')
          - (entry_shapes_body.content | b64decode) is search('from-text')
          - (entry_shapes_body.content | b64decode) is search('from-data')
          - (entry_shapes_body.content | b64decode) is search('third')
          - (entry_shapes_body.content | b64decode) is not search('first')
          - (entry_shapes_body.content | b64decode) is not search('second')
        fail_msg: >-
          Expected all four spellings to contribute and the third to win cfg.shared.
          Result: {{ entry_shapes_body.content | b64decode }}

    # format names the parser for a document the playbook wrote. It cannot mean anything beside a
    # path, whose parser comes from its extension, nor beside a structure this collection encodes
    # itself. Both are refused rather than quietly ignored, which is the difference between a play
    # that is corrected and a play that renders the wrong thing.
    - name: Attempt a format beside a path
      stop_cran.namespace2xml.render:
        inputs:
          - file: "{{ scratch.path }}/entries/base.txt"
            format: xml
        scheme:
          - data:
              cfg:
                output: xml
                root: cfg
        dest: "{{ scratch.path }}/format-file"
      register: format_beside_file
      ignore_errors: true

    - name: Attempt a format beside a structure
      stop_cran.namespace2xml.render:
        inputs:
          - data:
              a: 1
            format: yaml
        scheme:
          - data:
              cfg:
                output: xml
                root: cfg
        dest: "{{ scratch.path }}/format-data"
      register: format_beside_data
      ignore_errors: true

    - name: Both misplaced formats are refused, each naming what it was placed beside
      ansible.builtin.assert:
        that:
          - format_beside_file is failed
          - "'file' in format_beside_file.msg"
          - format_beside_data is failed
          - "'data' in format_beside_data.msg"
        fail_msg: >-
          Expected both to be refused.
          Beside a path: {{ format_beside_file.msg | default('the render succeeded') }}
          Beside a structure: {{ format_beside_data.msg | default('the render succeeded') }}

    # The module keeps both spellings of a scheme working together, because a 2.x play that already
    # passes scheme_text should be able to add an entry list without rewriting what it has. The
    # filter refuses the same combination; the asymmetry is deliberate and each side preserves what
    # its own callers already do.
    - name: Render with an entry-list scheme and a text scheme together
      stop_cran.namespace2xml.render:
        inputs:
          - text: |
              cfg.a=1
        scheme:
          - data:
              cfg:
                output: xml
        scheme_text: |
          cfg.root=configuration
        dest: "{{ scratch.path }}/scheme-both"
      register: scheme_append

    - name: Read what the appended scheme produced
      ansible.builtin.slurp:
        src: "{{ scheme_append.files[0] }}"
      register: scheme_append_body

    - name: The later scheme's root directive reached the document
      ansible.builtin.assert:
        that:
          - (scheme_append_body.content | b64decode) is search('configuration')
        fail_msg: >-
          Expected the appended scheme_text to supply the root.
          Result: {{ scheme_append_body.content | b64decode }}

  always:
    - name: Remove the scratch directory
      ansible.builtin.file:
        path: "{{ scratch.path }}"
        state: absent
