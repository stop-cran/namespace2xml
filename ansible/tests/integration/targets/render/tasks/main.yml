---
# Integration coverage for stop_cran.namespace2xml.render.
#
# The unit tests under tests/unit prove the encoder half of the filter: they take hand-authored
# profile text straight from the specification and assert that flatten() produces exactly it. They
# stub the binary out entirely, so they can run anywhere, but they can only ever prove that the
# filter says what the specification says to say.
#
# This target proves the other half. It runs the real transformer, from a real controller, through
# the real filter, and asserts the resulting *documents*. Those expectations are authored from
# docs/specification.md -- Section 16.1 for the format set, Section 16.3 for `root`, and the
# Section 16 output-option defaults, which fix `Declaration` and `Indent` at two ASCII spaces per
# nesting level -- and not captured from a tool run. Capturing them would make this file agree
# with whatever the tool currently does, which is the one thing it must not do.
#
# The first case is the README's headline example, verbatim. Documentation that no gate reads
# rots; asserting it here means the example on the collection's front page cannot silently stop
# being true.

- name: Render the README's headline example
  ansible.builtin.set_fact:
    xml_out: "{{ logback | stop_cran.namespace2xml.render('xml', root='configuration') }}"
  vars:
    logback:
      appender:
        name: STDOUT
        encoder:
          pattern: "%d{HH:mm:ss} %-5level %msg%n"
      root:
        level: info

- name: The rendered document is the one the README shows
  ansible.builtin.assert:
    that:
      - xml_out == expected_xml
    fail_msg: |
      Rendered XML did not match the specification-authored expectation.
      --- expected ---
      {{ expected_xml }}
      --- actual ---
      {{ xml_out }}
    success_msg: XML output matches the README example.
  vars:
    expected_xml: |
      <?xml version="1.0" encoding="utf-8"?>
      <configuration>
        <appender>
          <name>STDOUT</name>
          <encoder>
            <pattern>%d{HH:mm:ss} %-5level %msg%n</pattern>
          </encoder>
        </appender>
        <root>
          <level>info</level>
        </root>
      </configuration>

# Section 18 gives the profile a single payload type -- text -- and leaves it to each output format
# to decide how a scalar is spelled. JSON therefore infers: "3" is written as the number 3. That is
# a real fidelity limit rather than a bug, it is documented in the README, and it is asserted here
# so that the README and the tool cannot drift apart.

- name: Render a mapping to JSON
  ansible.builtin.set_fact:
    json_out: "{{ {'version': '3', 'name': 'demo'} | stop_cran.namespace2xml.render('json') }}"

- name: An unquoted-looking scalar is inferred as a JSON number
  ansible.builtin.assert:
    that:
      - (json_out | from_json).version == 3
      - (json_out | from_json).version is not string
      - (json_out | from_json).name == 'demo'
    fail_msg: "JSON type inference changed. Actual: {{ json_out }}"

# ...and the documented way back. The trap this pins is that a scheme rule's pattern must match the
# value's *full* profile path -- the selector plus every key -- so `cfg.version.type` is right here
# and `cfg.*.version.type` would silently match nothing. Section 15.2 makes that non-silent by
# emitting WARN009, which the filter forwards to the operator; this case proves the rule that does
# match actually takes effect.

- name: Force a string with an explicit scheme
  ansible.builtin.set_fact:
    typed_out: "{{ {'version': '3'} | stop_cran.namespace2xml.render('json', scheme=[{'text': scheme_text}]) }}"
  vars:
    scheme_text: |
      cfg.output=json
      cfg.version.type=string

- name: The explicit type rule wins over inference
  ansible.builtin.assert:
    that:
      - (typed_out | from_json).version == '3'
      - (typed_out | from_json).version is string
    fail_msg: "Explicit type=string did not take effect. Actual: {{ typed_out }}"

# The addressing gap, asserted as a refusal rather than described in prose. A profile name is a
# name, so under the default convention there is no way to reach an XML attribute, comment or CDATA
# node through this filter; Section 11.2 rejects the '@' spelling outright. An author who tries the
# obvious thing must get a diagnostic, not a document with a surprising element in it.

- name: Attempt to address an XML attribute
  ansible.builtin.set_fact:
    attr_out: "{{ {'node': {'@id': 'x'}} | stop_cran.namespace2xml.render('xml', root='r') }}"
  register: attr_result
  ignore_errors: true

- name: An attribute address is refused with XML002, not silently rendered
  ansible.builtin.assert:
    that:
      - attr_result is failed
      - "'XML002' in attr_result.msg"
    fail_msg: >-
      Expected an XML002 refusal for an '@' name.
      Result: {{ attr_result.msg | default(attr_out | default('<rendered>')) }}

# ...and the way through it, asserted against the real tool rather than against the encoder. The
# unit tests fix the profile text the filter emits, hand-authored from Section 11.4. These fix what
# the tool then makes of that text, so the two can only agree if the filter's reading of 11.4 and
# the tool's implementation of it are the same reading.

- name: Address an attribute and an element's own text with the xmltodict convention
  ansible.builtin.set_fact:
    xmltodict_out: >-
      {{ {'bean': {'@id': 'ds', '#text': 'hello'}}
         | stop_cran.namespace2xml.render('xml', root='beans', convention='xmltodict') }}

- name: The markers became addressing rather than element names
  ansible.builtin.assert:
    that:
      - "'id=\"ds\"' in xmltodict_out"
      - "'>hello<' in xmltodict_out"
      - "'@' not in xmltodict_out"
      - "'text' not in xmltodict_out"
    fail_msg: "Rendered: {{ xmltodict_out }}"

# Ordering is the part a mapping cannot carry on its own, which is why Section 11.4 makes every
# content node of a mixed element take a numbered part. Asserting the concatenation rather than the
# three pieces separately is the point: the pieces would pass even if the run came out reversed.

- name: Order mixed content with the xmltodict convention
  ansible.builtin.set_fact:
    mixed_out: >-
      {{ {'a': {'#0': 'before', '#1': {'b': 'child'}, '#2': 'after'}}
         | stop_cran.namespace2xml.render('xml', root='r', convention='xmltodict') }}

- name: The content nodes came out in the order their parts named
  ansible.builtin.assert:
    that:
      - "'before<b>child</b>after' in mixed_out"
    fail_msg: "Rendered: {{ mixed_out }}"

# Memoization must be an optimisation and nothing else. If a cached render could differ from an
# uncached one the cache would be a correctness feature, and every debugging session would start by
# wondering whether the cache was lying.

- name: Render the same data with memoization disabled
  ansible.builtin.set_fact:
    uncached_out: "{{ logback | stop_cran.namespace2xml.render('xml', root='configuration', memoize=false) }}"
  vars:
    logback:
      appender:
        name: STDOUT
        encoder:
          pattern: "%d{HH:mm:ss} %-5level %msg%n"
      root:
        level: info

- name: Bypassing the cache changes nothing but the process count
  ansible.builtin.assert:
    that:
      - uncached_out == xml_out
    fail_msg: A memoized render and an unmemoized render of the same data disagreed.

# The filter returns text and writes nothing, so idempotence belongs to `copy`. That is the whole
# argument for not making this a module, and it is worth proving rather than asserting: a filter
# that was not deterministic would show up here as a second run reporting changed=true.
#
# `memoize=false` is what makes that true. The default cache is keyed on the marshalled input, the
# scheme, the format and the tool identity, all four of which are identical to the render above, and
# the cache is a module global living for the whole ansible-playbook process. With memoization left
# on, the second render would be served from that dict without spawning the tool at all, and this
# block would assert the determinism of a dictionary lookup.

- name: Create a scratch directory
  ansible.builtin.tempfile:
    state: directory
    suffix: n2x
  register: scratch

- name: Write the rendered document
  ansible.builtin.copy:
    content: "{{ xml_out }}"
    dest: "{{ scratch.path }}/logback.xml"
    mode: "0644"
  register: first_write

- name: Write it again from a fresh render
  ansible.builtin.copy:
    content: "{{ logback | stop_cran.namespace2xml.render('xml', root='configuration', memoize=false) }}"
    dest: "{{ scratch.path }}/logback.xml"
    mode: "0644"
  register: second_write
  vars:
    logback:
      appender:
        name: STDOUT
        encoder:
          pattern: "%d{HH:mm:ss} %-5level %msg%n"
      root:
        level: info

- name: The second run is a no-op
  ansible.builtin.assert:
    that:
      - first_write is changed
      - second_write is not changed
    fail_msg: >-
      Re-rendering unchanged data produced a different document, so `copy` reported a change.
      Rendering is not deterministic.

# Section 15 picks the scheme parser from the file extension, so a mapping in the playbook is a
# JSON scheme document rather than a second dialect. What has to hold on a real binary is that
# the two spellings are one scheme: a converter that mangled a name or dropped a directive would
# still render something, and only a comparison against the text spelling catches it.
- name: Render one scheme in every spelling
  ansible.builtin.set_fact:
    from_text: "{{ logback | stop_cran.namespace2xml.render('xml', scheme=[{'text': text_scheme}]) }}"
    from_alias: "{{ logback | stop_cran.namespace2xml.render('xml', scheme_text=text_scheme) }}"
    from_mapping: "{{ logback | stop_cran.namespace2xml.render('xml', scheme_yaml=mapping_scheme) }}"
  vars:
    logback:
      appender:
        name: STDOUT
        encoder:
          pattern: "%d{HH:mm:ss} %-5level %msg%n"
      root:
        level: info
    text_scheme: |
      cfg.output=xml
      cfg.root=configuration
      cfg.appender.name.type=attribute
    mapping_scheme:
      cfg:
        output: xml
        root: configuration
        appender:
          name:
            type: attribute

- name: The two spellings of one scheme produce the same document
  ansible.builtin.assert:
    that:
      - from_mapping == from_text
      - "'name=\"STDOUT\"' in from_mapping"
    fail_msg: >-
      scheme_yaml is a spelling of scheme, not a dialect. The renders differ, so the mapping was
      translated into a scheme that means something else.
      text: {{ from_text }}
      mapping: {{ from_mapping }}

# `scheme_text` is the name the module gives inline text, accepted here so one spelling works in
# both plugins. It has to be the same argument and not a near-synonym, which only a byte
# comparison against `scheme` on a real binary can say.
- name: The module's name for inline text renders identically on the filter
  ansible.builtin.assert:
    that:
      - from_alias == from_text
    fail_msg: >-
      scheme_text is a second name for scheme, not a second argument. The renders differ.
      scheme: {{ from_text }}
      scheme_text: {{ from_alias }}

# The one change in 3.0 that could have been silent. Before it, a bare string here was scheme
# text; now a bare string in any source names a file. Reading it as a path would usually fail
# later with a confusing not-found, and could conceivably succeed against an unrelated file, so
# the filter refuses it up front and names the replacement spelling.
- name: Attempt the pre-3.0 spelling of inline scheme text
  ansible.builtin.set_fact:
    both_names: "{{ {'a': 'b'} | stop_cran.namespace2xml.render('xml', scheme=text_scheme) }}"
  vars:
    text_scheme: "cfg.output=xml\n"
  register: both_scheme_names
  ignore_errors: true

- name: The old spelling is refused by name rather than read as a path
  ansible.builtin.assert:
    that:
      - both_scheme_names is failed
      - "'is a string' in both_scheme_names.msg"
      - "'names a file' in both_scheme_names.msg"
      - "\"[{'text'\" in both_scheme_names.msg"
    fail_msg: >-
      Expected a bare-string scheme to be refused with the list spelling named. A play carrying
      the 2.x spelling must be told what to write, not handed a path error.
      {{ both_scheme_names }}

# A dot separates names in the text spelling and is a literal character in the mapping one. Left
# to the tool this surfaces as an unrecognized directive naming `cfg\u{2E}output`, which is
# accurate and unreadable. The filter has to refuse it first, in the author's own vocabulary.
- name: Attempt a mapping scheme with a dotted key
  ansible.builtin.set_fact:
    dotted: "{{ {'a': 'b'} | stop_cran.namespace2xml.render('xml', scheme_yaml={'cfg.output': 'xml'}) }}"
  register: dotted_key
  ignore_errors: true

- name: A dotted key is refused with the nested spelling named
  ansible.builtin.assert:
    that:
      - dotted_key is failed
      - "'cfg -> output' in dotted_key.msg"
      - "'cfg\\\\.output' in dotted_key.msg"
    fail_msg: >-
      Expected a refusal naming the nested spelling.
      Result: {{ dotted_key.msg | default('the render succeeded') }}

# The escape is the other half of the refusal above: section 8 spells a literal dot `\.`, and a
# key carrying one has to reach the tool as a single name. YAML quoting cannot express this --
# 'a.b' and a.b load to the same string -- so the escape is the only spelling there is. Rendered
# against the real tool rather than asserted at the plugin boundary, because the claim is about
# what the tool matches, not about what the converter emits.
- name: Render an input whose name part contains a literal dot
  ansible.builtin.set_fact:
    literal_dot: >-
      {{ {'a.b': 'hello', 'plain': 'world'}
         | stop_cran.namespace2xml.render(
             'xml',
             scheme_yaml={'cfg': {'output': 'xml', 'root': 'configuration',
                                  'a\.b': {'type': 'attribute'}}}) }}

- name: The escaped key selected the literal-dot name rather than matching nothing
  ansible.builtin.assert:
    that:
      - "'a.b=\"hello\"' in literal_dot"
      - "'<plain>world</plain>' in literal_dot"
    fail_msg: >-
      Expected the escaped key to place the literal-dot name as an attribute.
      Rendered: {{ literal_dot }}

- name: Stage a scheme file an entry list can name by string
  ansible.builtin.copy:
    dest: "{{ scratch.path }}/shared-scheme.txt"
    content: |
      cfg.output=xml
      cfg.root=configuration
    mode: "0644"

# Section 15.2 gives the last matching declaration precedence, and the filter appends the piped
# value after everything in 'inputs' (plugins/filter/render.py, _render). Both orderings are
# asserted at once here: 'later' beats 'earlier' among the inputs, and the piped mapping beats
# both. Every entry spelling the shared marshaller accepts appears, so a regression in any one
# of them shows up as a wrong value rather than as a skipped case.
- name: Stage a file an input entry can name
  ansible.builtin.copy:
    dest: "{{ scratch.path }}/layer.txt"
    content: |
      cfg.from_file=file-layer
      cfg.shared=earlier
    mode: "0644"

# A namespace input value decodes '\n' into a line break (Section 19.6, and conformance fixture
# 42), and a Jinja string literal in this position does not decode it first. Writing the text
# inline as '...\n...' therefore reaches the tool as one entry whose value contains a newline,
# not as two entries. The text is held in a block scalar here so the line breaks are real.
- name: Hold the text an input entry carries, with real line breaks
  ansible.builtin.set_fact:
    text_layer: |
      cfg.from_text=text-layer
      cfg.shared=later

- name: Render a piped mapping over an entry list using every input spelling
  ansible.builtin.set_fact:
    layered_filter: >-
      {{ {'shared': 'piped', 'from_pipe': 'pipe-layer'}
         | stop_cran.namespace2xml.render(
             'xml',
             scheme=[scratch.path ~ '/shared-scheme.txt'],
             inputs=[{'file': scratch.path ~ '/layer.txt'},
                     {'text': text_layer},
                     {'data': {'from_data': 'data-layer'}}]) }}

- name: Every layer contributed and the piped value won the shared name
  ansible.builtin.assert:
    that:
      - "'<from_file>file-layer</from_file>' in layered_filter"
      - "'<from_text>text-layer</from_text>' in layered_filter"
      - "'<from_data>data-layer</from_data>' in layered_filter"
      - "'<from_pipe>pipe-layer</from_pipe>' in layered_filter"
      - "'<shared>piped</shared>' in layered_filter"
      - "'earlier' not in layered_filter"
      - "'later' not in layered_filter"
    fail_msg: >-
      Expected all four layers to contribute, with the piped mapping winning 'shared'.
      Rendered: {{ layered_filter }}

# The module appends a mapping scheme to a text one; the filter refuses the pair outright. That
# difference is deliberate -- a filter call has no ordering between keyword arguments to appeal
# to -- so it is pinned here rather than left to drift into agreement with the module.
- name: Attempt both scheme spellings on the filter
  ansible.builtin.set_fact:
    both_schemes: >-
      {{ {'a': 'b'} | stop_cran.namespace2xml.render(
           'xml',
           scheme=[{'data': {'cfg': {'output': 'xml'}}}],
           scheme_text=text_layer) }}
  ignore_errors: true
  register: filter_both_schemes

- name: The pair is refused by name rather than one spelling being dropped
  ansible.builtin.assert:
    that:
      - filter_both_schemes is failed
      - "'scheme_text' in filter_both_schemes.msg"
    fail_msg: >-
      Expected the filter to refuse 'scheme' alongside 'scheme_text'.
      Got: {{ filter_both_schemes.msg | default('no failure') }}

- name: Remove the scratch directory
  ansible.builtin.file:
    path: "{{ scratch.path }}"
    state: absent
