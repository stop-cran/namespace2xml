---
# Issue #37. Measures whether a tool installed by a task is reachable by a filter later in the
# same play -- exactly the shape proposed for a collection that ships an install role alongside
# the filter that needs it.
#
# The original hypothesis was that it would not be reachable because a child process cannot alter
# the parent ansible-playbook process's PATH. The filter now deliberately searches the dotnet
# global-tools directory after PATH, so installing into ~/.dotnet/tools must work even when that
# directory was absent from the inherited PATH.
#
# The workflow runs this play three ways: with ~/.dotnet/tools off PATH, with it on PATH, and with
# NAMESPACE2XML set explicitly. All must pass. Branch events supply tool_source so the install uses
# the package built from the checked-out source; manual dispatch omits it to measure a published
# version.
- name: Install the tool, then use it in the same play
  hosts: localhost
  connection: local
  gather_facts: true

  vars:
    sample_config:
      appender:
        name: STDOUT
      root:
        level: INFO

  tasks:
    # tool_source is exclusive when supplied: branch tests must not resolve the same version from
    # a configured public feed instead of the checked-out package.
    - name: Install the tool the way an install role would
      ansible.builtin.command:
        argv: >-
          {{
            ['dotnet', 'tool', 'install', '--global', 'namespace2xml', '--version', tool_version]
            + (['--source', tool_source]
               if tool_source is defined and tool_source | length > 0
               else [])
          }}
      register: install
      changed_when: install.rc == 0
      failed_when:
        - install.rc != 0
        - "'already installed' not in install.stdout"
        - "'already installed' not in install.stderr"

    - name: Confirm the tool really is on disk, so a failure below is about PATH and not install
      ansible.builtin.stat:
        path: "{{ ansible_env.HOME }}/.dotnet/tools/namespace2xml"
      register: on_disk

    - name: Void the measurement if the install did not land
      ansible.builtin.assert:
        that:
          - on_disk.stat.exists
        fail_msg: >-
          The tool is not at ~/.dotnet/tools/namespace2xml, so a failure below would be an install
          failure rather than the PATH finding this play exists to measure.
        success_msg: the tool is on disk and executable

    # The step under measurement. Everything above only establishes that a failure here can have
    # exactly one cause.
    - name: Use the filter in the same play that installed the tool
      ansible.builtin.copy:
        content: "{{ sample_config | namespace2xml_render('json') }}"
        dest: "{{ output_dir }}/installed-then-used.json"
        mode: "0644"
